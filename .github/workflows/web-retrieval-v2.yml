name: NEXUS Science Agent Web Retrieval v2

on:
  pull_request:
    paths:
      - 'src/nexus_science_agent/retrieval.py'
      - 'tests/test_web_retrieval_v2.py'
      - 'docs/WEB_RETRIEVAL_V2.md'
      - '.github/workflows/web-retrieval-v2.yml'
  workflow_dispatch:

concurrency:
  group: nexus-science-web-retrieval-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_web_retrieval_v2.py
