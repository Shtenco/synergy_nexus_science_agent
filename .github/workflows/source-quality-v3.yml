name: NEXUS Science Source Quality v3

on:
  pull_request:
    paths:
      - 'src/nexus_science_agent/source_quality_v3.py'
      - 'tests/test_source_quality_v3.py'
      - 'docs/SOURCE_QUALITY_IDENTITY_V3.md'
      - '.github/workflows/source-quality-v3.yml'
  workflow_dispatch:

concurrency:
  group: nexus-science-source-quality-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_source_quality_v3.py
