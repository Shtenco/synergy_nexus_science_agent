name: science-service-protocol-v4

on:
  pull_request:
    paths:
      - 'src/nexus_science_agent/service_v4.py'
      - 'tests/test_science_service_v4.py'
      - 'schemas/nexus_science_service_v1.schema.json'
      - 'config/science_service_descriptor_v1.json'
      - '.github/workflows/science-service-protocol-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=src pytest -q tests/test_science_service_v4.py
      - run: python -m json.tool schemas/nexus_science_service_v1.schema.json >/dev/null
      - run: python -m json.tool config/science_service_descriptor_v1.json >/dev/null
