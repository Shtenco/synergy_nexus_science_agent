name: NEXUS Science Agent Research Core v1

on:
  pull_request:
    paths:
      - "src/nexus_science_agent/**"
      - "tests/**"
      - "fixtures/**"
      - "tools/run_demo_research.py"
      - "docs/RESEARCH_PIPELINE_V1.md"
      - ".github/workflows/research-core-v1.yml"
  push:
    paths:
      - "src/nexus_science_agent/**"
      - "tests/**"
      - "fixtures/**"
      - "tools/run_demo_research.py"
      - "docs/RESEARCH_PIPELINE_V1.md"
      - ".github/workflows/research-core-v1.yml"

permissions:
  contents: read

jobs:
  research-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python tools/run_demo_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-research-${{ matrix.python-version }}
          path: research_output/demo_research_v1.json
